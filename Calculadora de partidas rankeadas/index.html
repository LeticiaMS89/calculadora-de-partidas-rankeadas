<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Partidas Rankeadas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎮 Calculadora de Partidas Rankeadas</h1>
            
            <form id="formulario">
                <div class="input-group">
                    <label for="vitorias">Vitórias:</label>
                    <input 
                        type="number" 
                        id="vitorias" 
                        placeholder="Digite o número de vitórias" 
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="derrotas">Derrotas:</label>
                    <input 
                        type="number" 
                        id="derrotas" 
                        placeholder="Digite o número de derrotas" 
                        required
                    >
                </div>

                <button type="submit" class="btn-calcular">Calcular Nível</button>
            </form>

            <div id="resultado" class="resultado oculto">
                <h2 id="mensagem"></h2>
                <div id="nivel-badge" class="nivel-badge"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
